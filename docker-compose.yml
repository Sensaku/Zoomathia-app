services:
  backend:
    image: zoomathia/backend-fastapi:latest
    build:
      context: ./backend-fastapi
    ports:
      - "3001:3001"
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      SPARQL_ENDPOINT: "${SPARQL_ENDPOINT:-http://host.docker.internal:8080/sparql}"
      SPARQL_TIMEOUT: "${SPARQL_TIMEOUT:-30}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost","http://127.0.0.1","http://localhost:5173","http://127.0.0.1:5173"]}'
      STAGING_DB_PATH: "/app/storage/staging.db"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-storage:/app/storage
    restart: always

  frontend:
    image: zoomathia/frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-storage:
