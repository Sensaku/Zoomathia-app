[[package]]
name = "zoomathia-backend"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "fastapi" },
    { name = "httpx" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "python-multipart" },
    { name = "rdflib" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "respx" },
    { name = "ruff" },
]
docs = [
    { name = "mkdocs-material", version = "9.7.7", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "mkdocs-material", version = "9.8.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "mkdocstrings", version = "1.0.6", source = { registry = "https://pypi.org/simple" }, extra = ["python"], marker = "python_full_version < '3.11'" },
    { name = "mkdocstrings", version = "1.0.8", source = { registry = "https://pypi.org/simple" }, extra = ["python"], marker = "python_full_version >= '3.11'" },
]

[package.metadata]
requires-dist = [
    { name = "fastapi", specifier = ">=0.115.0" },
    { name = "httpx", specifier = ">=0.27.0" },
    { name = "pydantic", specifier = ">=2.8.0" },
    { name = "pydantic-settings", specifier = ">=2.4.0" },
    { name = "python-multipart", specifier = ">=0.0.9" },
    { name = "rdflib", specifier = ">=7.6.0" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.30.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = ">=2.4.1" },
    { name = "pytest", specifier = ">=8.0.0" },
    { name = "pytest-asyncio", specifier = ">=0.23.0" },
    { name = "respx", specifier = ">=0.23.1" },
    { name = "ruff", specifier = ">=0.17.5" },
]
docs = [
    { name = "mkdocs-material", specifier = ">=9.7.7" },
    { name = "mkdocstrings", extras = ["python"], specifier = ">=1.0.6" },
]
