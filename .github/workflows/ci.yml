# Checks defined in docs/development-guidelines.md ("Continuous integration").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly dependency audit, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14" # same uv as the one that wrote uv.lock; bump both together
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend reference (TypeDoc)
        working-directory: frontend
        run: |
          npm ci
          npm run docs
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14" # same uv as the one that wrote uv.lock; bump both together
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict --config-file ../mkdocs.yml

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14" # same uv as the one that wrote uv.lock; bump both together
      - name: Python dependencies
        id: pip_audit
        continue-on-error: true
        working-directory: backend-fastapi
        run: |
          set -o pipefail
          uv export --frozen --no-hashes --all-groups --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          # Pinned so that the audit does not change behaviour silently; bump it deliberately.
          uvx pip-audit@2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" 2>&1 | tee "$RUNNER_TEMP/pip-audit.txt"
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: npm dependencies
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee "$RUNNER_TEMP/npm-audit.txt"
      - name: Summary
        if: always()
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          NPM_AUDIT_OUTCOME: ${{ steps.npm_audit.outcome }}
        run: |
          {
            echo "## Dependency audit"
            echo
            echo "- pip-audit: $PIP_AUDIT_OUTCOME"
            echo "- npm audit: $NPM_AUDIT_OUTCOME"
            echo
            echo "### pip-audit"
            echo '```'
            cat "$RUNNER_TEMP/pip-audit.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "### npm audit"
            echo '```'
            cat "$RUNNER_TEMP/npm-audit.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on findings
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: |
          echo "The dependency audit failed or reported findings: see the job summary."
          exit 1
