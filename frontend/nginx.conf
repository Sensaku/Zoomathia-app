# Included by the image's nginx.conf inside its `http` block (copied to conf.d/default.conf),
# so `limit_req_zone` can be declared here.

# Anti-flood (RM-ACC-02): one bucket per client address. 30 requests/s with a burst of 300
# is sized for a class of about 30 people behind one address (to be tuned).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;

# Account entry points (login, registration, password reset): 10 requests per minute per client
# address, with a burst of 30 so that a workshop of 30 people behind one address can still log in
# (*proposed* values, docs/security.md). Password guessing is also limited per email by the API.
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Explicit request body cap (RM-ACC-02): the API only receives small JSON payloads.
    client_max_body_size 1m;

    # These three routes get their own, stricter zone instead of the general one (a regular
    # expression location wins over the `/api/` prefix). `/api/auth/me` stays in the general
    # zone: every page load calls it. `proxy_pass` has no URI part in a regular expression
    # location, so the `/api` prefix is removed by the rewrite.
    location ~ ^/api/auth/(login|register|password-reset)$ {
        limit_req zone=auth_per_ip burst=30 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=300 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend trusts this header to identify the client
        # (per-IP limits), and a value sent by the client must not survive. This nginx must
        # be the first hop, otherwise $remote_addr is the proxy's address (see docs/security.md).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
